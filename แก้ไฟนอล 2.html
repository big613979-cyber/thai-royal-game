<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมราชาศัพท์ (ฉบับแก้ไข)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Prompt:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* CSS พื้นฐาน */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; color: #333;
        }
        .container {
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 100%; max-width: 500px;
            text-align: center; border-top: 5px solid #FFD700;
        }
        h1 { color: #4A148C; margin: 0 0 10px 0; font-size: 1.5rem; line-height: 1.3; }
        h3 { color: #666; margin: 15px 0 10px 0; }
        
        /* ฟอร์มและปุ่ม */
        input, select {
            width: 100%; padding: 12px; font-size: 1rem;
            border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px;
            text-align: center; font-family: 'Prompt', sans-serif; background: #fff;
            color: #333;
        }
        input:focus, select:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px;
            font-family: 'Prompt', sans-serif; color: #4e3b00; background: #FFD700;
            box-shadow: 0 3px 0 #cfaf00; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #cfaf00; }
        .btn:hover { background: #ffd700; }
        .btn-green { background: #66bb6a; color: white; box-shadow: 0 3px 0 #43a047; }
        .btn-green:active { box-shadow: 0 1px 0 #43a047; }
        .btn-red { background: #ef5350; color: white; box-shadow: 0 3px 0 #c62828; }
        .btn-red:active { box-shadow: 0 1px 0 #c62828; }

        /* หน้าจอเกม */
        .hidden { display: none !important; }
        .game-bar {
            display: flex; justify-content: space-between; background: linear-gradient(to right, #667eea, #764ba2);
            padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold;
            color: white; font-size: 1rem;
        }
        .game-bar span { display: flex; align-items: center; gap: 5px; }
        .word-box {
            font-size: 2rem; color: #4A148C; font-weight: bold; margin: 20px 0;
            min-height: 60px; line-height: 1.3; word-wrap: break-word;
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn {
            background: #f5f5f5; border: 2px solid #e0e0e0; padding: 12px;
            border-radius: 10px; font-size: 0.95rem; min-height: 75px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none; transition: all 0.2s;
            text-align: center; word-wrap: break-word;
        }
        .option-btn:hover { background: #efefef; border-color: #bdbdbd; }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.disabled { cursor: not-allowed; opacity: 0.6; }
        .correct { background: #66bb6a !important; color: white !important; border-color: #66bb6a !important; }
        .wrong { background: #ef5350 !important; color: white !important; border-color: #ef5350 !important; }
        
        /* ตาราง */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; }
        td, th { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        td:first-child, th:first-child { text-align: left; }
        
        /* ข้อมูลเพิ่มเติม */
        .info-box { background: #f0f0f0; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; color: #666; }
        .medal { font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าจอเริ่มต้น -->
    <div id="start-screen">
        <div style="font-size: 48px; margin-bottom: 10px;">🏯</div>
        <h1>เกิดใหม่อีกที<br>ก็เป็นชาววังไปซะแล้ว</h1>
        
        <input type="text" id="username" placeholder="ตั้งชื่อเล่น..." maxlength="20">
        
        <h3>เลือกความยาก:</h3>
        <select id="difficulty-select">
            <option value="mix">🔀 รวมมิตร (สุ่มทั้งหมด)</option>
            <option value="easy">🟢 ระดับง่าย</option>
            <option value="medium">🟡 ระดับกลาง</option>
            <option value="hard">🔴 ระดับยาก</option>
        </select>
        
        <h3>เลือกเวลา:</h3>
        <button class="btn" onclick="tryStartGame(20)">⏱️ 20 วินาที</button>
        <button class="btn" onclick="tryStartGame(40)">⏱️ 40 วินาที</button>
        <button class="btn" onclick="tryStartGame(60)">⏱️ 60 วินาที</button>
        
        <div class="info-box">
            💡 เฉลยคำศัพท์ราชาศัพท์ที่เกี่ยวกับพระมหากษัตริย์<br>
            คำถูก +10 คะแนน | คำผิด -5 คะแนน
        </div>
    </div>

    <!-- หน้าจอเกม -->
    <div id="game-screen" class="hidden">
        <div class="game-bar">
            <span>📊 คะแนน: <strong id="score">0</strong></span>
            <span>⏱️ เวลา: <strong id="timer" style="color:#FFD700;">0</strong></span>
        </div>
        
        <div style="color:#888; font-size:0.9rem; margin-bottom:10px;">คำสามัญ:</div>
        <div class="word-box" id="question-text">...</div>
        
        <div style="color:#666; font-size:0.85rem; margin-bottom:10px;">เลือกคำราชาศัพท์ที่ถูกต้อง:</div>
        <div class="options-grid" id="options-area"></div>
    </div>

    <!-- หน้าจอจบเกม -->
    <div id="end-screen" class="hidden">
        <div style="font-size: 48px; margin-bottom: 10px;">🎉</div>
        <h1>จบเกม!</h1>
        
        <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
            <div style="margin-bottom:10px; font-size:0.9rem;">
                <strong>ชื่อผู้เล่น:</strong> <span id="final-name">-</span>
            </div>
            <div style="margin-bottom:10px; font-size:0.9rem;">
                <strong>ยศ:</strong> <span id="final-rank" style="color:#4A148C; font-weight:bold;">-</span>
            </div>
            <div style="font-size: 2.5rem; color: #FFD700; font-weight:bold; margin: 10px 0;">
                <span id="final-score">0</span> 🎖️
            </div>
        </div>
        
        <button class="btn btn-green" onclick="location.reload()">🔄 เล่นใหม่</button>
        
        <div style="margin-top:20px; border-top:2px solid #ddd; padding-top:15px;">
            <h3>🏆 อันดับคะแนน</h3>
            <table id="leaderboard-table"></table>
            <button class="btn btn-red" onclick="clearScore()" style="margin-top:10px; font-size:0.9rem; padding:10px;">
                🗑️ ล้างสถิติ
            </button>
        </div>
    </div>
</div>

<script>
    // --- 1. ข้อมูลคำศัพท์ (แยกหมวด) ---
    var wordsEasy = [
        { q: "ไป", a: "เสด็จฯ" },
        { q: "กิน", a: "เสวย" },
        { q: "นอน", a: "บรรทม" },
        { q: "นั่ง / อยู่", a: "ประทับ" },
        { q: "พูด", a: "ตรัส" },
        { q: "คำนำหน้ากริยา", a: "ทรง" },
        { q: "ชอบ / พอใจ", a: "โปรด" },
        { q: "โกรธ", a: "กริ้ว" },
        { q: "ให้ (ของ)", a: "พระราชทาน" },
        { q: "มอบให้ (แก่เจ้า)", a: "ถวาย" },
        { q: "เกิด", a: "ประสูติ" },
        { q: "ตาย (กษัตริย์)", a: "สวรรคต" },
        { q: "ตาย (เจ้านาย)", a: "สิ้นพระชนม์" },
        { q: "บวช", a: "ผนวช" },
        { q: "ทำงาน", a: "ทรงงาน" },
        { q: "ฟังเทศน์", a: "ทรงธรรม" },
        { q: "ขี่ม้า", a: "ทรงม้า" },
        { q: "ดู / มอง", a: "ทอดพระเนตร" },
        { q: "หัว", a: "พระเศียร" },
        { q: "หน้า", a: "พระพักตร์" },
        { q: "ตา", a: "พระเนตร" },
        { q: "ปาก", a: "พระโอษฐ์" },
        { q: "มือ", a: "พระหัตถ์" },
        { q: "เท้า", a: "พระบาท" },
        { q: "ใจ", a: "พระทัย" },
        { q: "ท้อง", a: "พระนาภี" },
        { q: "เลือด", a: "พระโลหิต" },
        { q: "คอ", a: "พระศอ" },
        { q: "ในหลวง", a: "พระเจ้าอยู่หัว" },
        { q: "ราชินี", a: "พระราชินี" },
        { q: "พ่อ", a: "พระบิดา" },
        { q: "แม่", a: "พระมารดา" },
        { q: "ลูกชาย", a: "พระโอรส" },
        { q: "ลูกสาว", a: "พระธิดา" },
        { q: "เมีย", a: "พระชายา" },
        { q: "ผัว", a: "พระสวามี" },
        { q: "พี่ชาย", a: "พระเชษฐา" },
        { q: "น้องชาย", a: "พระอนุชา" },
        { q: "ไหว้", a: "ถวายบังคม" },
        { q: "ป่วย (พระ)", a: "อาพาธ" }
    ];
    
    var wordsMedium = [
        { q: "ผม", a: "พระเกศา" },
        { q: "หน้าผาก", a: "พระนลาฏ" },
        { q: "คิ้ว", a: "พระขนง" },
        { q: "จมูก", a: "พระนาสิกา" },
        { q: "แก้ม", a: "พระปราง" },
        { q: "ฟัน", a: "พระทนต์" },
        { q: "หู", a: "พระกรรณ" },
        { q: "หนวด", a: "พระมัสสนา" },
        { q: "หน้าอก", a: "พระอุระ" },
        { q: "อก", a: "พระทรวง" },
        { q: "หัวใจ", a: "พระหทัย" },
        { q: "ตัก / ขา", a: "พระจังคะ" },
        { q: "หัวเข่า", a: "พระชานุ" },
        { q: "เหงื่อ", a: "พระเสโท" },
        { q: "ปู่ / ตา", a: "พระอัยกา" },
        { q: "ย่า / ยาย", a: "พระอัยยิกา" },
        { q: "ลุง / อา (ชาย)", a: "พระปิตุลา" },
        { q: "ป้า / อา (หญิง)", a: "พระปิตุจฉา" },
        { q: "น้า (ชาย)", a: "พระมาตุลา" },
        { q: "น้า (หญิง)", a: "พระมาตุจฉา" },
        { q: "น้องสาว", a: "พระขนิ-พัน" },
        { q: "หลาน", a: "พระราชนัดดา" },
        { q: "ภรรยาเอก", a: "พระมเหสี" },
        { q: "ภรรยารอง", a: "พระสนม" },
        { q: "เสื้อผ้า", a: "ฉลองพระองค์" },
        { q: "แว่นตา", a: "ฉลองพระเนตร" },
        { q: "รองเท้า", a: "ฉลองพระบาท" },
        { q: "เตียง", a: "พระแท่น" },
        { q: "ที่นั่ง", a: "พระราชอาสน์" },
        { q: "รูปถ่าย", a: "พระบรมฉายาพิม" },
        { q: "บ้าน", a: "พระตำหนัก" },
        { q: "เงิน", a: "พระราชทรัพย์" },
        { q: "ป่วย", a: "ทรงพระประชวร" },
        { q: "หัวเราะ", a: "ทรงพระสรวล" },
        { q: "เขียน/อ่าน", a: "ทรงพระอักษร" },
        { q: "แต่งหนังสือ", a: "ทรงพระสวดคำ" },
        { q: "คำสอน", a: "พระบรมราโชวาท" },
        { q: "ทักทาย", a: "พระราชปฏิสันถาร" },
        { q: "คำสั่งสูงสุด", a: "พระราชกฤษฎีกา" },
        { q: "ชื่อ (เซ็นชื่อ)", a: "พระปรมาภิไธย" }
    ];

    var wordsHard = [
        { q: "ศีรษะ (สูงสุด)", a: "พระเจ้า" },
        { q: "ไรผม", a: "พระจุไร" },
        { q: "ผม (มุ่นมวย)", a: "พระศก" },
        { q: "ขนหว่างคิ้ว", a: "พระอุณาโลม" },
        { q: "ดวงตา (ลูกตา)", a: "พระจักษุ" },
        { q: "ลิ้น", a: "พระชิวรา" },
        { q: "คาง", a: "พระหนุ" },
        { q: "ไหปลาร้า", a: "พระรากขวัญ" },
        { q: "บ่า / ไหล่", a: "พระอังสา" },
        { q: "แขน (ท่อนบน)", a: "พระพาหา" },
        { q: "แขน (ท่อนล่าง)", a: "พระกร" },
        { q: "ข้อศอก", a: "พระกะชอก" },
        { q: "นิ้วมือ", a: "พระองคุลี" },
        { q: "นิ้วชี้", a: "พระดัชนี" },
        { q: "เล็บ", a: "พระนขา" },
        { q: "เอว", a: "พระกฤษฎี" },
        { q: "สีข้าง", a: "พระปรัศว์" },
        { q: "หลัง", a: "พระปฤษฎางค์" },
        { q: "ตะโพก", a: "พระโสณี" },
        { q: "กระดูก", a: "พระอัฐิ" },
        { q: "เถ้ากระดูก", a: "พระอังคาร" },
        { q: "น้ำเหลือง", a: "พระบุพโพ" },
        { q: "ปอด", a: "พระปับผาสะ" },
        { q: "ไต", a: "พระวักกะ" },
        { q: "ตับ", a: "พระยกนะ" },
        { q: "ทวด (ชาย)", a: "พระปัยกา" },
        { q: "ทวด (หญิง)", a: "พระปัยยิกา" },
        { q: "ลูกสะใภ้", a: "พระสุณิสา" },
        { q: "ลูกเขย", a: "พระชามาดา" },
        { q: "เหลน", a: "พระราชปนัดดา" },
        { q: "ไม้เท้า", a: "ธารพระกร" },
        { q: "หมอน", a: "พระเขนย" },
        { q: "ม่าน", a: "พระวิสูตร" },
        { q: "หน้าต่าง", a: "พระบัญชร" },
        { q: "ประตู", a: "พระทวาร" },
        { q: "กระจกส่อง", a: "พระฉาย" },
        { q: "หวี", a: "พระสาง" },
        { q: "น้ำดื่ม", a: "พระสุธารส" },
        { q: "หมาก", a: "พระศรี" },
        { q: "เหล้า", a: "น้ำจัณฑ์" }
    ];

    // รวมคำศัพท์
    var allWords = wordsEasy.concat(wordsMedium, wordsHard);

    // --- 2. ตัวแปรเกม ---
    var currentPool = [];
    var currentQuestion = {};
    var score = 0;
    var timer = 0;
    var timerInterval = null;
    var playerName = "";
    var canClick = true;
    var totalQuestions = 0;
    var correctAnswers = 0;

    // --- 3. ฟังก์ชันหลัก ---
    function tryStartGame(seconds) {
        try {
            startGame(seconds);
        } catch (e) {
            alert("เกิดข้อผิดพลาด: " + e.message);
            console.error(e);
        }
    }

    function startGame(seconds) {
        var inputName = document.getElementById("username").value.trim();
        playerName = inputName || "ผู้เล่นนิรนาม";

        timer = seconds;
        score = 0;
        canClick = true;
        totalQuestions = 0;
        correctAnswers = 0;
        
        var diff = document.getElementById("difficulty-select").value;
        if (diff === 'easy') currentPool = wordsEasy.slice();
        else if (diff === 'medium') currentPool = wordsMedium.slice();
        else if (diff === 'hard') currentPool = wordsHard.slice();
        else currentPool = allWords.slice();

        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("end-screen").classList.add("hidden");

        updateDisplay();
        nextQuestion();

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            timer--;
            updateDisplay();
            if (timer <= 0) {
                endGame();
            }
        }, 1000);
    }

    function nextQuestion() {
        canClick = true;

        if (currentPool.length === 0) {
            var diff = document.getElementById("difficulty-select").value;
            if (diff === 'easy') currentPool = wordsEasy.slice();
            else if (diff === 'medium') currentPool = wordsMedium.slice();
            else if (diff === 'hard') currentPool = wordsHard.slice();
            else currentPool = allWords.slice();
        }

        var index = Math.floor(Math.random() * currentPool.length);
        currentQuestion = currentPool.splice(index, 1)[0];
        totalQuestions++;

        document.getElementById("question-text").innerText = currentQuestion.q;

        var options = [currentQuestion.a];
        while (options.length < 4) {
            var randItem = allWords[Math.floor(Math.random() * allWords.length)];
            var randWord = randItem.a;
            
            var isDuplicate = false;
            for(var i = 0; i < options.length; i++) {
                if(options[i] === randWord) {
                    isDuplicate = true;
                    break;
                }
            }
            if (!isDuplicate) options.push(randWord);
        }
        
        options.sort(function() { return 0.5 - Math.random(); });

        var html = "";
        for (var i = 0; i < options.length; i++) {
            var w = options[i];
            html += '<div class="option-btn" onclick="checkAnswer(this, \'' + w.replace(/'/g, "\\'") + '\')">' + w + '</div>';
        }
        document.getElementById("options-area").innerHTML = html;
    }

    function checkAnswer(btn, ans) {
        if (!canClick) return;
        canClick = false;

        var allBtns = document.getElementsByClassName("option-btn");
        for(var i = 0; i < allBtns.length; i++) {
            allBtns[i].classList.add("disabled");
        }

        if (ans === currentQuestion.a) {
            btn.classList.add("correct");
            score += 10;
            correctAnswers++;
        } else {
            btn.classList.add("wrong");
            for(var i = 0; i < allBtns.length; i++) {
                if(allBtns[i].innerText === currentQuestion.a) {
                    allBtns[i].classList.add("correct");
                    break;
                }
            }
            if(score > 0) score -= 5;
        }
        updateDisplay();

        setTimeout(function() {
            if (timer > 0) nextQuestion();
        }, 1000);
    }

    function updateDisplay() {
        document.getElementById("score").innerText = score;
        document.getElementById("timer").innerText = timer;
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");
        
        document.getElementById("final-score").innerText = score;
        document.getElementById("final-name").innerText = playerName;

        var rank = "ชาวบ้านทั่วไป";
        if (score >= 50) rank = "มหาดเล็กฝึกหัด";
        if (score >= 100) rank = "มหาดเล็กหุ้มแพร";
        if (score >= 200) rank = "คุณพระ";
        if (score >= 300) rank = "พระยา";
        if (score >= 400) rank = "เจ้าพระยา";
        if (score >= 500) rank = "สมเด็จเจ้าพระยา";
        if (score >= 700) rank = "พระราชาธิราช";
        
        document.getElementById("final-rank").innerText = rank;

        saveScore();
        renderLeaderboard();
    }

    // --- 4. ระบบบันทึกคะแนน ---
    function saveScore() {
        var oldData = localStorage.getItem("royalGameFinal");
        var history = oldData ? JSON.parse(oldData) : [];
        
        history.push({ 
            name: playerName, 
            score: score,
            date: new Date().toLocaleDateString('th-TH')
        });
        
        history.sort(function(a, b) { return b.score - a.score; });
        history = history.slice(0, 10);
        
        localStorage.setItem("royalGameFinal", JSON.stringify(history));
    }

    function renderLeaderboard() {
        var oldData = localStorage.getItem("royalGameFinal");
        var history = oldData ? JSON.parse(oldData) : [];
        var html = "";
        
        if(history.length === 0) {
            html = "<tr><td colspan='2' style='text-align:center;'>ไม่มีสถิติ</td></tr>";
        } else {
            var medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣", "6️⃣", "7️⃣", "8️⃣", "9️⃣", "🔟"];
            for(var i = 0; i < history.length; i++) {
                var medal = medals[i] || (i + 1);
                html += "<tr><td><span class='medal'>" + medal + "</span> " + history[i].name + "</td><td><strong>" + history[i].score + "</strong></td></tr>";
            }
        }
        document.getElementById("leaderboard-table").innerHTML = html;
    }

    function clearScore() {
        if(confirm("ลบสถิติทั้งหมด?")) {
            localStorage.removeItem("royalGameFinal");
            renderLeaderboard();
        }
    }
</script>

</body>
</html>
